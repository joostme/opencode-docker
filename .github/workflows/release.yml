name: Release

on:
  push:
    branches:
      - main
      - master
      - beta

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install release dependencies
        run: npm ci

      - name: Create release PR or publish release
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          version-script: npm run version-packages
          commit-message: "chore: release"
          pr-title: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub release
        id: github_release
        if: steps.changesets.outputs.has-changesets == 'false'
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Export release metadata
        if: steps.github_release.outputs.created == 'true'
        run: |
          VERSION="${{ steps.github_release.outputs.version }}"
          IMAGE_NAME="${{ steps.github_release.outputs.image }}"
          if [[ "$VERSION" == *-* ]]; then
            # Pre-release (e.g. 3.0.0-beta.0): tag version and channel only, never latest
            CHANNEL="${VERSION#*-}"
            CHANNEL="${CHANNEL%%.*}"
            TAGS="${IMAGE_NAME}:${VERSION}"$'\n'"${IMAGE_NAME}:${CHANNEL}"
          else
            VERSION_MINOR=${VERSION%.*}
            TAGS="${IMAGE_NAME}:${VERSION}"$'\n'"${IMAGE_NAME}:${VERSION_MINOR}"$'\n'"${IMAGE_NAME}:latest"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          {
            echo "IMAGE_TAGS<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        if: steps.github_release.outputs.created == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU
        if: steps.github_release.outputs.created == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Log in to GHCR
        if: steps.github_release.outputs.created == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.github_release.outputs.created == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_TAGS }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
